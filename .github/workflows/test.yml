name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: [self-hosted, Linux, docker]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        # A venv, not the runner's interpreter: self-hosted Pythons persist
        # between jobs, and other repos' jobs install task-worker-api into them.
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v
      - name: Run supervisor verification
        run: python -m pytest tests/test_docker_supervisor.py tests/test_windows_supervisor.py -q

  windows-supervisor:
    name: Windows supervisor verification (py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"
      - name: Run supervisor verification
        shell: bash
        run: python -m pytest tests/test_docker_supervisor.py tests/test_windows_supervisor.py tests/test_windows_appcontainer.py tests/test_windows_launch.py -q -ra --junitxml=supervisor-results.xml 2>&1 | tee supervisor-output.txt
      - name: Upload supervisor verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-verification-windows-py312
          path: |
            supervisor-output.txt
            supervisor-results.xml
          if-no-files-found: warn
